name: spottr
services:
  gateway:
    image: spottr-gateway:local
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file:
      - ${SPOTTR_GATEWAY_ENV_FILE:-./gateway.env}
    environment:
      HOST: 0.0.0.0
      PORT: "8787"
      NODE_ENV: production
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=1777"]
    mem_limit: 256m
    cpus: 0.75
    pids_limit: 100
    restart: unless-stopped
    stop_grace_period: 70s
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    environment:
      SPOTTR_HOSTNAME: ${SPOTTR_HOSTNAME:?Set the approved DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set the operator ACME email}
      SPOTTR_ALLOWED_CIDRS: ${SPOTTR_ALLOWED_CIDRS:-127.0.0.1/32 ::1/128}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 100
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      gateway:
        condition: service_healthy
    logging:
      driver: local
      options: {max-size: 5m, max-file: "2"}
volumes:
  caddy_data:
  caddy_config:
